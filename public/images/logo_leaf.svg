<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="goldStemGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="60" cy="60" r="45" fill="#f59e0b" opacity="0.15" />

  <!-- Main Organic Golden Leaf Blade (Upper Section) -->
  <path d="M26,98 C24,84 28,60 48,42 C68,24 88,20 102,18 C98,34 94,54 78,72 C64,88 44,96 26,98 Z" 
        fill="url(#goldLeafGrad)" />

  <!-- Curved Stem & Midrib Slicing Arch (Lower Section) -->
  <path d="M24,102 C28,92 38,76 56,62 C74,48 88,36 98,24 C82,38 66,52 48,68 C36,78 28,92 24,102 Z" 
        fill="url(#goldStemGrad)" 
        opacity="0.95" />

  <!-- Dynamic Sparkle Stars -->
  <!-- Top Left Sparkle -->
  <path d="M36,22 Q36,28 30,28 Q36,28 36,34 Q36,28 42,28 Q36,28 36,22 Z" fill="#fffbeb" opacity="0.95" />
  <circle cx="36" cy="28" r="1" fill="#ffffff" />

  <!-- Top Center-Right Sparkle -->
  <path d="M92,10 Q92,16 86,16 Q92,16 92,22 Q92,16 98,16 Q92,16 92,10 Z" fill="#ffffff" />
  <circle cx="92" cy="16" r="1.2" fill="#ffffff" />

  <!-- Far Left Small Sparkle -->
  <path d="M20,48 Q20,52 16,52 Q20,52 20,56 Q20,52 24,52 Q20,52 20,48 Z" fill="#fef08a" opacity="0.8" />

  <!-- Bottom Right Sparkle -->
  <path d="M96,68 Q96,75 89,75 Q96,75 96,82 Q96,75 103,75 Q96,75 96,68 Z" fill="#ffffff" />
  <circle cx="96" cy="75" r="1.5" fill="#ffffff" />
</svg>
