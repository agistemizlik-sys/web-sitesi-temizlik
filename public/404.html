<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Sayfa Bulunamadı | RELAXAX</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f6f2;
      color: #1b1d22;
      font-family: Georgia, 'Times New Roman', serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e6e3db;
      border-radius: 20px;
      padding: 56px 40px;
      max-width: 520px;
      box-shadow: 0 18px 40px rgba(27, 29, 34, 0.06);
    }
    svg { display: block; margin: 0 auto 20px; }
    h1 {
      font-size: 2rem;
      font-weight: 500;
      margin: 0 0 10px;
      letter-spacing: 0.01em;
    }
    p {
      color: #676c78;
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0 0 8px;
    }
    p[lang="pl"] { font-size: 0.95rem; }
    a.home {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 28px;
      background: #1b1d22;
      color: #ffffff;
      text-decoration: none;
      border-radius: 999px;
      font-family: Inter, Arial, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }
    a.home:hover { background: #2563eb; }
    .accent {
      width: 56px;
      height: 3px;
      border-radius: 2px;
      background: #2563eb;
      margin: 18px auto 20px;
    }
  </style>
</head>
<body>
  <main class="card">
    <svg viewBox="0 0 100 80" width="52" height="42" fill="none" stroke="#1b1d22" stroke-width="1.5" role="img" aria-label="RELAXAX">
      <path d="M35,40 C20,25 20,5 35,5 C50,5 50,25 35,40 Z" />
      <path d="M65,40 C80,25 80,5 65,5 C50,5 50,25 65,40 Z" />
    </svg>
    <h1>Sayfa Bulunamadı</h1>
    <div class="accent"></div>
    <p>Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir. Sinematik temizlik deneyimimiz ana sayfada sizi bekliyor.</p>
    <p lang="pl">Strona, której szukasz, nie istnieje. Zapraszamy na stronę główną.</p>
    <a class="home" href="https://relaxax.com/">Ana Sayfaya Dön · Strona Główna</a>
  </main>
</body>
</html>
