<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3366ff" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#ab47bc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="45" fill="#030614" stroke="url(#roseGrad)" stroke-width="2" />
  <g filter="url(#glow)" stroke="url(#roseGrad)" stroke-width="2.5" fill="none">
    <!-- Left Rose Path -->
    <path d="M42,50 C32,38 32,24 42,24 C52,24 52,38 42,50 Z" />
    <path d="M42,44 C36,36 36,29 42,29 C48,29 48,36 42,44 Z" />
    <!-- Right Rose Path -->
    <path d="M58,50 C68,38 68,24 58,24 C48,24 48,38 58,50 Z" />
    <path d="M58,44 C64,36 64,29 58,29 C52,29 52,36 58,44 Z" />
    <!-- Interconnecting Stems -->
    <path d="M50,42 C50,60 42,75 50,75 C58,75 50,60 50,42 Z" stroke-dasharray="2 2" />
  </g>
</svg>
