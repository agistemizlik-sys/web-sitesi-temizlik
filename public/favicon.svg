<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="relaxaxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#3366ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#071018" stroke="url(#relaxaxGrad)" stroke-width="2.5" />
  <g filter="url(#glow)">
    <!-- RELAXAX Sparkle Star -->
    <path d="M25,50 Q40,50 40,35 Q40,50 55,50 Q40,50 40,65 Q40,50 25,50 Z" fill="url(#relaxaxGrad)" />
    <!-- RELAXAX Bubbles -->
    <circle cx="64" cy="40" r="8" stroke="url(#relaxaxGrad)" stroke-width="2" fill="none" />
    <circle cx="78" cy="48" r="5" stroke="url(#relaxaxGrad)" stroke-width="1.5" fill="none" />
  </g>
</svg>
