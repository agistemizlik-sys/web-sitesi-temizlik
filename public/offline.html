<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>RELAXAX — Çevrimdışı Mod / Offline Mode</title>
  <meta name="theme-color" content="#030712">
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(13, 22, 44, 0.85);
      --border: rgba(56, 189, 248, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #38bdf8;
      --green: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .offline-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 20px;
    }
    .icon-wrap {
      font-size: 3.5rem;
      margin-bottom: 16px;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      margin-bottom: 10px;
      color: #ffffff;
    }
    p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-reload {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.4);
    }
    .btn-call {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }
    .btn-wa {
      background: rgba(37, 211, 102, 0.15);
      border: 1px solid rgba(37, 211, 102, 0.35);
      color: #25d366;
    }
    .footer-note {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="brand-pill">✨ RELAXAX PWA</div>
    <div class="icon-wrap">📶</div>
    <h1>İnternet Bağlantısı Bekleniyor</h1>
    <p>Cihazınız şu anda çevrimdışı görünüyor. İnternet bağlantınız sağlandığında web sitesi otomatik olarak açılacaktır.</p>

    <div class="actions-grid">
      <button type="button" class="btn btn-reload" onclick="window.location.reload()">
        <span>🔄 Bağlantıyı Yeniden Dene</span>
      </button>
      <a href="tel:+905466479004" class="btn btn-call">
        <span>📞 Çağrı Merkezi: 0546 647 90 04</span>
      </a>
      <a href="https://wa.me/905466479004" target="_blank" rel="noopener noreferrer" class="btn btn-wa">
        <span>💬 WhatsApp İletişim</span>
      </a>
    </div>

    <div class="footer-note">
      7/24 Kesintisiz Profesyonel Temizlik & Hijyen Hizmetleri
    </div>
  </main>
</body>
</html>
